  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"658946f8-cc44-4e5b-abc9-42adab14470c\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>\n    body{margin:0;background:#F7F6F4;font-family:Helvetica,Arial,\"Segoe UI\",sans-serif;}\n    a{color:#E31E24;}\n    a:hover{color:#B01319;}\n  <\u002Fstyle>\n  <script src=\"983f5012-8b09-4f94-a182-7a39526a183f\"><\u002Fscript>\n  <script src=\"77d4dbd1-d897-4556-a880-3d882156c35a\"><\u002Fscript>\n  <script src=\"9bbee726-81d0-4dcd-96fe-f6293500a94d\"><\u002Fscript>\n  <script src=\"4a8cdad7-e4b4-41f6-8fd4-304e67920e97\"><\u002Fscript>\n  <script src=\"acd6dfdb-12ec-4d2e-9e35-c84295af240a\"><\u002Fscript>\n  <script src=\"75212379-e275-492c-9581-d558bf6606bf\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div style=\"max-width:1180px;margin:0 auto;padding:36px 40px 0;box-sizing:border-box;\">\n  <div style=\"display:flex;align-items:center;gap:20px;padding-bottom:20px;border-bottom:2px solid #1D1D1D;\">\n    <img src=\"013321dc-12fe-47ad-bd5e-b699ad404bc2\" alt=\"Universidad Autónoma de Chile\" style=\"width:78px;height:67px;flex-shrink:0;\">\n    <h1 style=\"margin:0;font-size:30px;font-weight:800;color:#1A1A1A;letter-spacing:-0.3px;line-height:1.12;text-wrap:pretty;\">Analítica para la Gestión Académica de la Retención de 1<sup style=\"font-size:0.6em;\">er<\u002Fsup> Año (Cohorte 2026)<\u002Fh1>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1180px;margin:0 auto;padding:0 40px 64px;box-sizing:border-box;color:#1A1A1A;\">\n\n  <div style=\"font-size:12.5px;color:#68666A;margin:22px 0 12px 2px;font-style:italic;\">Selecciona el o los apartados que deseas explorar.<\u002Fdiv>\n\n  <div data-acc=\"header\" style=\"border-left:5px solid #E31E24;padding:8px 0 8px 18px;font-size:20px;font-weight:800;letter-spacing:0.2px;text-transform:uppercase;margin:8px 0 10px;cursor:pointer;user-select:none;\" style-hover=\"background:#F0EFEC;\">1. Presentación<\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E2DFDA;border-radius:2px;padding:16px 24px 12px;margin-bottom:14px;\">\n    <p style=\"font-size:13px;line-height:1.6;margin:0 0 10px;text-wrap:pretty;\">El presente reporte identifica a estudiantes de la cohorte 2026 que presentan riesgos académicos con incidencia en su retención de primer año, la que será medida al 30 de abril de 2027. Este grupo prioritario debe ser acompañado académica, psicoeducativa y psicoafectivamente, de modo que pueda persistir en sus estudios universitarios. El reporte informa, además, la evolución histórica de la retención de 1<sup>er<\u002Fsup> año, la matrícula de la cohorte 2026 y su situación actual (13 de octubre de 2026).<\u002Fp>\n    <p style=\"font-size:13px;line-height:1.6;margin:0 0 12px;text-wrap:pretty;\">El primer año corresponde a la etapa de inserción a la vida universitaria del Modelo Educativo institucional: el estudiante se integra académica y socialmente, consolida hábitos de estudio y valida su elección vocacional. Es el tramo de mayor deserción de la trayectoria formativa, por lo que la detección temprana de un bajo rendimiento y de un escaso avance curricular resulta decisiva para intervenir a tiempo (<i>Tinto, 2012<\u002Fi>).<\u002Fp>\n    <button type=\"button\" id=\"btnBiblio\" style=\"display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:3px;border:1px solid #E2DFDA;background:#F5F4F1;color:#1D1D1D;font-weight:600;font-size:12.5px;cursor:pointer;font-family:inherit;line-height:1.4;margin-bottom:12px;\" style-hover=\"background:#ECEAE5;\">Acceso a publicaciones de interés<\u002Fbutton>\n    <p style=\"font-size:13px;line-height:1.6;margin:0 0 12px;text-wrap:pretty;\">Los estándares de acreditación CNA hacen hincapié, para el nivel de excelencia, en el desarrollo de \"… estrategias institucionales de monitoreo de la progresión estudiantil\", así como en la capacidad institucional para mostrar \"evidencias de que sus acciones generan la mejora continua de los indicadores de procesos y resultados de la enseñanza y aprendizaje\". Esto constituye un desafío que la Universidad aborda sistemáticamente.<\u002Fp>\n    <p style=\"font-size:13px;line-height:1.6;margin:0;\">En este contexto, se invita a revisar el presente reporte y a activar el protocolo de actuación propuesto.<\u002Fp>\n  <\u002Fdiv>\n\n  <div data-acc=\"header\" style=\"border-left:5px solid #E31E24;padding:8px 0 8px 18px;font-size:20px;font-weight:800;letter-spacing:0.2px;text-transform:uppercase;margin:18px 0 10px;cursor:pointer;user-select:none;\" style-hover=\"background:#F0EFEC;\">2. Evolución Retención de primer año<span style=\"display:block;font-weight:500;font-size:12.5px;color:#68666A;text-transform:none;margin-top:4px;letter-spacing:0.2px;\">Periodo: 2016 (cohorte 2015) a 2026 (cohorte 2025)<\u002Fspan><\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E2DFDA;border-radius:2px;padding:16px 24px 12px;margin-bottom:14px;\">\n    <div id=\"flt-evo\"><\u002Fdiv>\n    <h2 style=\"font-size:16px;margin:0 0 2px;font-weight:800;\">Evolución Retención 1.er Año<\u002Fh2>\n    <p id=\"evoDesc\" style=\"font-size:12.5px;color:#68666A;margin:0 0 12px;\">Serie histórica por cohorte de ingreso, graficada en el año de medición.<\u002Fp>\n    <div style=\"position:relative;height:360px;\"><canvas id=\"chartEvo\"><\u002Fcanvas><\u002Fdiv>\n    <div style=\"font-size:10.5px;line-height:1.6;color:#666666;margin-top:12px;\">Nota metodológica: cada punto corresponde a la retención de 1.er año de una cohorte, graficada en su año de medición (cohorte 2015 → 2016). Al seleccionar una carrera, su serie —por campus y jornada, según los filtros activos— se compara con la serie de la facultad a la que pertenece y con la referencia corporativa de la jornada seleccionada (Corporativo Pregrado si no se filtra jornada). Al combinar Campus y Facultad se muestra el campus y cada carrera de esa facultad impartida en él. Las series de facultad y de campus no se desagregan por jornada en la fuente. Los años sin dato se unen de forma continua y las series se grafican tal como figuran en la base oficial, incluidos valores de 0% o 100% propios de cohortes pequeñas.<\u002Fdiv>\n    <div style=\"font-size:10.5px;color:#8B94A0;margin-top:10px;text-align:right;\">Fuente: Retención 1.er año, PBI DAI-VRAC (excluye Campus Virtual).<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-acc=\"header\" style=\"border-left:5px solid #E31E24;padding:8px 0 8px 18px;font-size:20px;font-weight:800;letter-spacing:0.2px;text-transform:uppercase;margin:18px 0 10px;cursor:pointer;user-select:none;\" style-hover=\"background:#F0EFEC;\">3.0. Evaluación del Riesgo Académico<\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E2DFDA;border-radius:2px;padding:16px 24px 12px;margin-bottom:14px;\">\n    <p style=\"font-size:13px;line-height:1.5;margin:0 0 10px;text-wrap:pretty;\">Los factores de riesgo académico considerados para la cohorte 2026 son la efectividad y el rendimiento (notas). La efectividad se mide con la Efectividad en el Avance Curricular (EAC), es decir, la tasa de aprobación de los créditos inscritos; el rendimiento, con el promedio general del período en curso.<\u002Fp>\n    <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;\">\n      <div style=\"flex:1;min-width:240px;background:#F7F6F4;border:1px solid #E2DFDA;border-radius:6px;padding:10px 16px;\">\n        <b style=\"font-size:12.5px;color:#B01319;\">Efectividad en el Avance Curricular (EAC) al 28-09-2026<\u002Fb>\n        <div style=\"font-size:13px;color:#68666A;margin-top:4px;\">N° de créditos aprobados / N° de créditos inscritos · corte 50%<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1;min-width:240px;background:#F7F6F4;border:1px solid #E2DFDA;border-radius:6px;padding:10px 16px;\">\n        <b style=\"font-size:12.5px;color:#B01319;\">Promedio General al 07-10-2026<\u002Fb>\n        <div style=\"font-size:13px;color:#68666A;margin-top:4px;\">Escala 1,0 – 7,0, redondeado a 1 decimal · corte 4,0<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#1D1D1D;color:#fff;font-size:12px;font-weight:700;letter-spacing:0.4px;padding:7px 14px;border-radius:5px 5px 0 0;\">GRUPOS DE RIESGO ACADÉMICO<\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));border:1px solid #E2DFDA;border-top:none;border-radius:0 0 5px 5px;overflow:hidden;margin-bottom:6px;\">\n      <div style=\"padding:10px 16px;border-bottom:1px solid #E2DFDA;border-right:1px solid #E2DFDA;display:flex;align-items:center;gap:10px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:#2E7D5B;flex-shrink:0;\"><\u002Fspan><div><b style=\"font-size:13px;\">Riesgo \"Bajo\"<\u002Fb><div style=\"font-size:12px;color:#68666A;\">EAC ≥ 50% y Promedio ≥ 4,0<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:10px 16px;border-bottom:1px solid #E2DFDA;display:flex;align-items:center;gap:10px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:#4A7FB5;flex-shrink:0;\"><\u002Fspan><div><b style=\"font-size:13px;\">Riesgo \"Medio Bajo\"<\u002Fb><div style=\"font-size:12px;color:#68666A;\">EAC ≥ 50% y Promedio &lt; 4,0<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:10px 16px;border-bottom:1px solid #E2DFDA;border-right:1px solid #E2DFDA;display:flex;align-items:center;gap:10px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:#E8A33D;flex-shrink:0;\"><\u002Fspan><div><b style=\"font-size:13px;\">Riesgo \"Medio Alto\"<\u002Fb><div style=\"font-size:12px;color:#68666A;\">EAC &lt; 50% y Promedio ≥ 4,0<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:10px 16px;border-bottom:1px solid #E2DFDA;display:flex;align-items:center;gap:10px;\"><span style=\"width:12px;height:12px;border-radius:50%;background:#B23A3A;flex-shrink:0;\"><\u002Fspan><div><b style=\"font-size:13px;\">Riesgo \"Alto\"<\u002Fb><div style=\"font-size:12px;color:#68666A;\">EAC &lt; 50% y Promedio &lt; 4,0<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n      <div style=\"padding:10px 16px;display:flex;align-items:center;gap:10px;grid-column:1 / -1;background:#FAFAF9;\"><span style=\"width:12px;height:12px;border-radius:50%;background:#8C8A86;flex-shrink:0;\"><\u002Fspan><div><b style=\"font-size:13px;\">Sin información académica<\u002Fb><div style=\"font-size:12px;color:#68666A;\">EAC no disponible (#N/A) o Promedio no disponible (#N/A / \"Sin notas\")<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:10.5px;color:#8B94A0;margin:0;\">Nota: los 4 grupos son mutuamente excluyentes — cruzan el corte de EAC (50%) con el corte de Promedio General (4,0). Se calculan exclusivamente sobre los estudiantes en estado \"Activo\" (N = 6.290), incluidos los 74 activos de la modalidad A Distancia (Campus Virtual).<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-acc=\"header\" style=\"border-left:5px solid #E31E24;padding:8px 0 8px 18px;font-size:20px;font-weight:800;letter-spacing:0.2px;text-transform:uppercase;margin:18px 0 10px;cursor:pointer;user-select:none;\" style-hover=\"background:#F0EFEC;\">3.1. Descripción de la Frecuencia de notas y de efectividad en el avance curricular<\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E2DFDA;border-radius:2px;padding:16px 24px 12px;margin-bottom:14px;\">\n    <p style=\"font-size:13px;line-height:1.6;margin:0 0 14px;text-wrap:pretty;\">En este apartado se describe la distribución de la Cohorte 2026 en los dos factores que componen el modelo de riesgo académico: el Promedio General de calificaciones y la Efectividad en el Avance Curricular (EAC). Los histogramas muestran cómo se concentran los estudiantes en cada tramo y su posición respecto de los cortes de 4,0 y 50%, lo que permite dimensionar tempranamente la población cercana o bajo dichos umbrales antes de su clasificación en grupos de riesgo.<\u002Fp>\n    <div id=\"flt-frec\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px;\"><span style=\"font-size:12px;font-weight:600;color:#68666A;\">Selecciona el indicador a visualizar:<\u002Fspan><div role=\"tablist\" style=\"display:inline-flex;gap:4px;padding:4px;background:#F1F3F5;border:1px solid #E2DFDA;border-radius:999px;flex-wrap:wrap;\"><button type=\"button\" role=\"tab\" id=\"tab-notas\" aria-selected=\"true\" style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;border:none;font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap;transition:background 0.15s,color 0.15s,box-shadow 0.15s;background:#fff;color:#1A1A1A;font-weight:800;box-shadow:0 1px 4px rgba(29,29,29,0.16);\"><span style=\"display:inline-flex;color:#E31E24;\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"><\u002Fpath><rect x=\"7\" y=\"12\" width=\"3\" height=\"6\"><\u002Frect><rect x=\"12\" y=\"8\" width=\"3\" height=\"10\"><\u002Frect><rect x=\"17\" y=\"5\" width=\"3\" height=\"13\"><\u002Frect><\u002Fsvg><\u002Fspan><span>3.1 Frecuencia de Notas<\u002Fspan><\u002Fbutton><button type=\"button\" role=\"tab\" id=\"tab-eac\" aria-selected=\"false\" style=\"display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;border:none;font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap;transition:background 0.15s,color 0.15s,box-shadow 0.15s;background:transparent;color:#68666A;font-weight:600;box-shadow:none;\"><span style=\"display:inline-flex;color:#8B94A0;\"><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"19\" y1=\"5\" x2=\"5\" y2=\"19\"><\u002Fline><circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"><\u002Fcircle><circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"><\u002Fcircle><\u002Fsvg><\u002Fspan><span>3.2 Frecuencia de % EAC<\u002Fspan><\u002Fbutton><\u002Fdiv><\u002Fdiv>\n    <div id=\"pane-notas\">\n    <p style=\"font-size:12.5px;color:#68666A;margin:0 0 12px;\">Histograma del promedio general por tramos de 0,5 punto, con la curva de densidad ajustada. La línea roja marca el corte de 4,0 que define los grupos de riesgo.<\u002Fp>\n    <div id=\"chartNotasStats\" style=\"display:flex;flex-wrap:wrap;gap:0;margin:0 0 12px;border-right:1px solid #E2DFDA;width:fit-content;max-width:100%;\"><\u002Fdiv>\n    <div style=\"position:relative;height:360px;\"><canvas id=\"chartNotas\"><\u002Fcanvas><\u002Fdiv>\n    <div id=\"notasNote\" style=\"font-size:10.5px;line-height:1.6;color:#666666;margin-top:12px;\"><\u002Fdiv>\n    <div style=\"font-size:10.5px;color:#8B94A0;margin-top:10px;text-align:right;\">Elaboración DCA-VRAC con datos de Ecosistema PBI DPD.<\u002Fdiv>\n    <\u002Fdiv>\n    <div id=\"pane-eac\" style=\"display:none;\">\n    <p style=\"font-size:12.5px;color:#68666A;margin:0 0 12px;\">Histograma del % EAC (créditos aprobados / créditos inscritos) por tramos de 10 puntos porcentuales, con la curva de densidad ajustada. La línea roja marca el corte de 50%.<\u002Fp>\n    <div id=\"chartEACStats\" style=\"display:flex;flex-wrap:wrap;gap:0;margin:0 0 12px;border-right:1px solid #E2DFDA;width:fit-content;max-width:100%;\"><\u002Fdiv>\n    <div style=\"position:relative;height:360px;\"><canvas id=\"chartEAC\"><\u002Fcanvas><\u002Fdiv>\n    <div id=\"eacNote\" style=\"font-size:10.5px;line-height:1.6;color:#666666;margin-top:12px;\"><\u002Fdiv>\n    <div style=\"font-size:10.5px;color:#8B94A0;margin-top:10px;text-align:right;\">Elaboración DCA-VRAC. EAC: fuente DPD-VRA.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-size:10.5px;line-height:1.6;color:#666666;margin-top:12px;padding-top:10px;border-top:1px solid #EEECE8;text-wrap:pretty;\"><b>Nota sobre la N de cada pestaña:<\u002Fb> La diferencia en la cantidad de estudiantes entre la Frecuencia de Notas (N=6.087) y la Frecuencia de % EAC (N=6.584) responde a la disponibilidad de registros al momento del corte: existen estudiantes con carga de créditos e hitos de avance curricular registrados (% EAC) que aún no cuentan con un promedio de calificaciones definitivo consolidado en el sistema.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-acc=\"header\" style=\"border-left:5px solid #E31E24;padding:8px 0 8px 18px;font-size:20px;font-weight:800;letter-spacing:0.2px;text-transform:uppercase;margin:18px 0 10px;cursor:pointer;user-select:none;\" style-hover=\"background:#F0EFEC;\">3.2. Identificación de grupos de riesgo académico<\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E2DFDA;border-radius:2px;padding:16px 24px 12px;margin-bottom:14px;\">\n    <p style=\"font-size:13px;line-height:1.6;margin:0 0 14px;text-wrap:pretty;\">A continuación se presenta la caracterización y distribución de la población de estudiantes activos de la Cohorte 2026 según su nivel de riesgo académico, resultante del cruce entre su Efectividad en el Avance Curricular (EAC) y su Promedio General de calificaciones. Esta categorización permite identificar las prioridades de atención preventiva para la gestión de acompañamiento.<\u002Fp>\n    <div id=\"flt-riesgo\"><\u002Fdiv>\n    <div id=\"riskKpiRow\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px;\"><\u002Fdiv>\n    <h2 style=\"font-size:16px;margin:6px 0 4px;font-weight:800;\">Gráfico de dispersión de los grupos de riesgo<\u002Fh2>\n    <p style=\"font-size:12.5px;color:#68666A;margin:0 0 12px;\">Cada punto es un estudiante de la cohorte 2026, ubicado según su EAC y su promedio general. Las líneas de corte determinan los cuatro grupos de riesgo; los estudiantes sin información académica no se grafican.<\u002Fp>\n    <div style=\"position:relative;height:440px;\"><canvas id=\"chartRiesgo\"><\u002Fcanvas><\u002Fdiv>\n    <div style=\"font-size:10.5px;color:#8B94A0;margin-top:10px;text-align:right;\">Elaboración DCA-VRAC. EAC: fuente DPD-VRA. Promedio: Ecosistema PBI DPD.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-acc=\"header\" style=\"border-left:5px solid #E31E24;padding:8px 0 8px 18px;font-size:20px;font-weight:800;letter-spacing:0.2px;text-transform:uppercase;margin:18px 0 10px;cursor:pointer;user-select:none;\" style-hover=\"background:#F0EFEC;\">4. Matrícula objetivo <span style=\"text-transform:none;\">(proxy)<\u002Fspan> y holgura para la retención de primer año<span style=\"display:block;font-weight:500;font-size:12.5px;color:#68666A;text-transform:none;margin-top:4px;letter-spacing:0.2px;\">Meta de estudiantes activos al 30 de abril de 2027 por carrera, campus y jornada/modalidad<\u002Fspan><\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E2DFDA;border-radius:2px;padding:16px 24px 14px;margin-bottom:14px;\">\n    <p style=\"font-size:13px;line-height:1.6;margin:0 0 10px;text-wrap:pretty;\">Este apartado informa, para cada carrera según su campus y jornada/modalidad, la tasa de retención de primer año registrada por la cohorte 2025 y la holgura: el número de estudiantes de la cohorte 2026 que aún podrían desertar sin que la carrera caiga bajo esa tasa de referencia. Las unidades bajo la meta o con holgura baja se destacan para orientar la priorización del acompañamiento. <b><i>Aclaración de Proxy:<\u002Fi><\u002Fb> La matrícula objetivo y la holgura son un proxy (indicador de aproximación operacional) al 30 de abril de 2027. Para su cálculo se utilizó la tasa histórica de la cohorte anterior (2025, medida en 2026). La estimación de base es a nivel de carrera/campus/modalidad-jornada. A partir de esta se agregan los valores a nivel de Sede, de Facultad y Corporativo. Por esta razón los valores agregados tienen desviaciones. Para aquellos programas sin trayectoria previa, se recurre a la tasa de retención de primer año de la jornada equivalente o total de la carrera (Proxy). Esto proporciona una meta cuantitativa temprana para orientar las acciones preventivas de acompañamiento estudiantil a nivel de carrera, según su modalidad-jornada y el campus respectivo.<\u002Fp>\n    <div id=\"flt-proxy\"><\u002Fdiv>\n    <div id=\"proxyKpis\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-bottom:12px;\"><\u002Fdiv>\n    <div style=\"display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:#3F3D42;margin:0 0 8px;\"><span style=\"display:inline-flex;align-items:center;gap:6px;\"><span style=\"width:10px;height:10px;border-radius:3px;background:#D9363E;\"><\u002Fspan><b>Bajo la meta<\u002Fb>: holgura negativa<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;\"><span style=\"width:10px;height:10px;border-radius:3px;background:#E8A33D;\"><\u002Fspan><b>En riesgo<\u002Fb>: holgura de 0 a 2 estudiantes<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;\"><span style=\"width:10px;height:10px;border-radius:3px;background:#2E7D5B;\"><\u002Fspan><b>Con margen<\u002Fb>: holgura de 3 o más<\u002Fspan><span style=\"display:inline-flex;align-items:center;gap:6px;\"><span style=\"width:10px;height:10px;border-radius:3px;background:#C9C5BE;\"><\u002Fspan><b>Sin serie<\u002Fb>: sin referencia histórica<\u002Fspan><\u002Fdiv>\n    <div id=\"proxyView\"><\u002Fdiv>\n    <div id=\"proxyExcl\" style=\"display:none;font-size:10.5px;line-height:1.55;color:#666666;margin-top:8px;\"><\u002Fdiv>\n    <details style=\"margin-top:12px;border:1px solid #E2DFDA;border-radius:6px;background:#F7F6F4;\"><summary style=\"cursor:pointer;padding:10px 14px;font-size:12px;font-weight:800;color:#1D1D1D;letter-spacing:0.2px;\">Notas metodológicas <span style=\"font-weight:500;color:#68666A;\">(clic para desplegar)<\u002Fspan><\u002Fsummary><div style=\"font-size:11.5px;line-height:1.6;color:#3F3D42;background:#F7F6F4;border:1px solid #E2DFDA;border-radius:6px;padding:10px 14px;text-wrap:pretty;border:none;border-top:1px solid #E2DFDA;border-radius:0 0 6px 6px;\"><b>Nota metodológica:<\u002Fb> Fuente: Holgura cohorte 2026 - 301026 (hoja DETALLE HOLGURA). Matrícula oficial SIES 2026 y activos según registro Argos al 13/10/2026. % de retención de primer año de la cohorte 2025 (medida en 2026) por carrera, campus y jornada. Matrícula objetivo = Matrícula SIES × % de retención de referencia, redondeada al entero superior en cada unidad; Holgura = Activos − Matrícula objetivo. Matrícula objetivo por unidad carrera-campus-jornada redondeada al entero superior (criterio de la base de origen). La facultad de cada carrera se asigna según la base de Grupos de riesgo.<div style=\"margin-top:8px;\"><b>Corrección aplicada a la base:<\u002Fb> en Ingeniería Civil Industrial · Talca · Vespertino se reemplazó el proxy \"total de la carrera\" (85,7%) por la tasa Corporativa Vespertina 2025 (78,6%), ya que la carrera registra historia en jornada vespertina en otros campus. Con ello su objetivo pasa de 17 a 15 y su holgura de 0 a +2; esta corrección afecta las fichas por carrera y la suma de unidades.<\u002Fdiv><div style=\"margin-top:8px;\"><b>Sobre el % de retención 2025 y la matrícula objetivo agregada:<\u002Fb> el % mostrado corresponde a la cifra oficial de \"Retención 1 año 2026\" para el nivel seleccionado (por ejemplo, Corporativo 88,6%), en coherencia con otros reportes institucionales. Cuando existe cifra oficial para el nivel (Corporativo, Campus, Facultad, Jornada, Carrera o Carrera en un campus), la matrícula objetivo se calcula como Matrícula SIES del nivel × % oficial, con redondeo al entero más cercano, y la holgura como Activos − Matrícula objetivo. Por ello, la suma de las metas de cada carrera (por campus y jornada) no coincide exactamente con la meta del nivel agregado. Cuando no existe cifra oficial para la combinación de filtros, se muestra un promedio ponderado por matrícula, identificado como \"estimado\", y la matrícula objetivo es la suma de las unidades.<\u002Fdiv><\u002Fdiv><\u002Fdetails>\n    <div style=\"font-size:10.5px;color:#8B94A0;margin-top:10px;text-align:right;\">Elaboración DCA-VRAC. Fuentes: SIES DAI-VRAC, Argos 13-10-2026, Retención 1.er año PBI DAI-VRAC.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div data-acc=\"header\" style=\"border-left:5px solid #E31E24;padding:8px 0 8px 18px;font-size:20px;font-weight:800;letter-spacing:0.2px;text-transform:uppercase;margin:18px 0 10px;cursor:pointer;user-select:none;\" style-hover=\"background:#F0EFEC;\">5. Protocolo de Actuación<span style=\"display:block;font-weight:500;font-size:12.5px;color:#68666A;text-transform:none;margin-top:4px;letter-spacing:0.2px;line-height:1.5;text-wrap:pretty;\">Plan de acción institucional para el acompañamiento académico, psicoeducativo y psicoafectivo de los estudiantes del grupo de riesgo académico \"ALTO\". Este plan complementa las acciones emprendidas por las facultades, las carreras y las sedes.<\u002Fspan><\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid #E2DFDA;border-radius:2px;padding:20px 24px 24px;margin-bottom:14px;\"><div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;\"><h2 style=\"font-size:16px;margin:0;font-weight:800;text-transform:uppercase;letter-spacing:0.3px;color:#1A1A1A;\">Protocolo Equipos de Gestión y SAAC ZERO<\u002Fh2><span style=\"display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.6;white-space:nowrap;background:#FDECEC;color:#B01319;border:1px solid #F6C9CB;\">Grupo de riesgo \"Alto\"<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;align-items:start;\"><div style=\"background:#fff;border:1px solid #E2DFDA;border-top:3px solid #1D1D1D;border-radius:10px;box-shadow:0 4px 18px rgba(29,29,29,0.06);padding:18px 22px 8px;display:flex;flex-direction:column;\
